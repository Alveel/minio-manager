buckets:
  - name: integration-test-default-bucket
    object_lifecycle_file: tests/fixtures/lifecycle_policies/alternative_lifecycle_60_days.json
    versioning: Enabled
    # Note: bucket policy changes to full access (updated policy)
  - name: integration-test-custom-bucket
    object_lifecycle_file: tests/fixtures/lifecycle_policies/alternative_lifecycle_120_days.json
    versioning: Suspended
    # Note: no policy specified, so existing policy should be removed
  - name: integration-test-minimal-bucket
    object_lifecycle_file: tests/fixtures/lifecycle_policies/alternative_lifecycle_90_days.json
    versioning: Suspended
    # Note: no policy specified

bucket_policies:
  - bucket: integration-test-default-bucket
    policy_file: tests/fixtures/bucket_policies/default_bucket_updated_policy.json
  # Note: integration-test-custom-bucket and integration-test-minimal-bucket have no policies
  # so existing policies should be removed
